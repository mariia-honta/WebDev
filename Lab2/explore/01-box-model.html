<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <title>4.1 Box Model</title>
    <style>
      .box {
        width: 200px;
        height: 100px;
        padding: 20px;
        border: 10px solid blue;
        margin-bottom: 20px;
      }

      .content-box {
        box-sizing: content-box;
      }

      .border-box {
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div class="box content-box">content-box</div>
    <div class="box border-box">border-box</div>
  </body>
</html>
