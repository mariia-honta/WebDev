<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <title>4.1 Semantic HTML</title>
  </head>
  <body>
    <h2>Варіант А — не семантичний (div)</h2>
    <div class="header">
      <p>Шапка сайту</p>
    </div>
    <div class="main">
      <p>Основний контент</p>
    </div>
    <div class="footer">
      <p>Підвал сайту</p>
    </div>

    <hr />

    <h2>Варіант Б — семантичний</h2>
    <header>
      <p>Шапка сайту</p>
    </header>
    <main>
      <p>Основний контент</p>
    </main>
    <footer>
      <p>Підвал сайту</p>
    </footer>
  </body>
</html>
